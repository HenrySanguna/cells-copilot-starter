  # Evidencia RED en CI: los tests que añade o cambia una PR de fix deben fallar con el código de la rama base.
  # Si pasan sin el fix, no demuestran la vulnerabilidad. Un test puede fallar por otra razón (p. ej. un método
  # que añade el fix): eso lo sigue revisando una persona con la evidencia de T1.
  name: evidence

  'on': pull_request

  # Mínimo privilegio: el token de este workflow solo puede leer el repo.
  permissions:
    contents: read

  concurrency:
    group: evidence-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    red-on-base:
      # Solo PR de remediación; las de proceso (chore/, ci/) no traen test de ataque.
      if: startsWith(github.head_ref, 'fix/')
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            fetch-depth: 0
            persist-credentials: false

        - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
            node-version: 24
            cache: pnpm

        - run: pnpm install --frozen-lockfile

        - name: Changed tests must fail on the base code
          run: |
            base="origin/${{ github.base_ref }}"
            tests=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'src/**/*.test.ts')
            if [ -z "$tests" ]; then
              echo "::error::A fix PR must add or change a test"
              exit 1
            fi
            git diff --name-only "$base"...HEAD -- src ':(exclude)src/**/*.test.ts' | while read -r f; do
              if git cat-file -e "$base:$f" 2>/dev/null; then
                git checkout "$base" -- "$f"
              else
                rm -f "$f"
              fi
            done
            if pnpm vitest run $tests; then
              echo "::error::Tests pass without the fix: they do not prove the vulnerability"
              exit 1
            fi
